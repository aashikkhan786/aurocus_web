<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurocous Admin — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #FFFFFF;
            --cloud-white: #F4F8F6;
            --deep-navy: #101E28;
            --electric-blue: #00B865;
            --cyan: #01856d;
            --slate: #4E6573;
            --border: #E2E8F0;
            --danger: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #F4F8F6 0%, #E6F4EE 100%);
            color: var(--deep-navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(20, 43, 74, 0.08);
            border: 1px solid rgba(40, 100, 215, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-logo {
            font-family: 'Manrope', sans-serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--deep-navy), var(--electric-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            display: inline-block;
        }
        .login-subtitle {
            color: var(--slate);
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--deep-navy);
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .form-input:focus {
            border-color: var(--electric-blue);
            box-shadow: 0 0 0 3px rgba(40, 100, 215, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--electric-blue), var(--cyan));
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(40, 100, 215, 0.25);
        }
        .error-msg {
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--slate);
            text-decoration: none;
        }
        .back-link:hover {
            color: var(--electric-blue);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <a href="/" style="text-decoration: none; display: inline-block; margin-bottom: 8px;">
                <img src="/static/images/logo.png" alt="Aurocous" style="max-height: 44px; max-width: 200px; object-fit: contain; display: block; margin: 0 auto;">
            </a>
            <p class="login-subtitle">Admin Control Panel</p>
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/admin/login" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-input" type="text" id="username" name="username" required autofocus placeholder="Enter admin username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn-submit">Sign In to Dashboard</button>
        </form>

        <a href="/" class="back-link">&larr; Back to Aurocous Homepage</a>
    </div>
</body>
</html>
